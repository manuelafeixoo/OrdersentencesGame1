<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrange the Sentence - Complete Edition</title>
    <style>
        /* Base Kid-Friendly Styles */
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Nunito', sans-serif;
            background-color: #f4f9ff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
            overflow-x: hidden; 
        }

        h1 {
            color: #ff8b94;
            text-shadow: 2px 2px 0px #ffe1e4;
            margin: 5px 0 10px 0;
            font-size: 2rem;
            text-align: center;
        }

        /* Setup Screen */
        .setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-top: 10px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .config-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .config-label {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .mode-btn {
            padding: 8px 15px;
            border: 3px solid #81d4fa;
            background: white;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            color: #0d47a1;
        }

        .mode-btn.selected {
            background: #baffc9;
            border-color: #2e7d32;
        }

        .player-setup-box {
            background: #f0f7ff;
            border: 3px solid #bae1ff;
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .player-setup-box input {
            padding: 6px 10px;
            font-size: 1rem;
            border: 2px solid #81d4fa;
            border-radius: 10px;
            width: 80%;
            font-family: inherit;
            text-align: center;
        }

        .avatar-selector {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .avatar-option {
            font-size: 1.3rem;
            padding: 3px 5px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }

        .avatar-option:hover {
            transform: scale(1.1);
        }

        .avatar-option.selected {
            background: #baffc9;
            border-color: #2e7d32;
            transform: scale(1.15);
        }

        /* Stats Bar */
        .stats-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .timer-display {
            background: #ffebee;
            color: #c62828;
            padding: 3px 12px;
            border-radius: 15px;
            border: 2px solid #ef9a9a;
            display: none;
        }

        .scores-container {
            display: flex;
            gap: 15px;
        }

        .score-counter {
            background: #f1f1f1;
            padding: 8px 18px;
            border-radius: 25px;
            border: 3px solid #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            opacity: 0.7;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .score-counter.active-player {
            background: #fff9c4;
            border-color: #fbc02d;
            box-shadow: 0 0 15px rgba(251, 192, 45, 0.6);
            opacity: 1;
            transform: scale(1.1);
        }

        .game-container {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            gap: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Word Bank Area */
        .word-bank {
            position: relative;
            width: 100%;
            height: 200px; 
            background-color: #e0f7fa;
            border: 4px dashed #81d4fa;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .word-bank::before {
            content: 'Word Bank (Drag or Click words)';
            position: absolute;
            top: 10px;
            left: 15px;
            color: #81d4fa;
            font-weight: bold;
            font-size: 1rem;
            pointer-events: none;
        }

        /* Drop Zone (Sentence Area) */
        .drop-zone {
            min-height: 80px; 
            background-color: #fff9c4;
            border: 4px dashed #fff176;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            transition: background-color 0.3s;
        }

        .drop-zone.drag-over {
            background-color: #fffae6;
            border-color: #ffeb3b;
        }

        /* Word Cards */
        .word-card {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #444;
            cursor: pointer; 
            user-select: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s;
            touch-action: manipulation; 
        }

        .word-card:active {
            transform: scale(0.95);
        }

        .word-card.dragging {
            opacity: 0.5;
            box-shadow: none;
        }

        .in-bank {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
        }

        .in-drop-zone {
            position: relative;
            transform: none !important;
            top: auto;
            left: auto;
            box-shadow: 0 3px 0 rgba(0,0,0,0.15);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }

        .btn-check { background-color: #baffc9; color: #2e7d32; }
        .btn-reset { background-color: #ffdfba; color: #e65100; }
        .btn-skip { background-color: #e0e0e0; color: #616161; }
        .btn-help { background-color: #fff59d; color: #f57f17; }
        .btn-home { background-color: #ffcdd2; color: #b71c1c; }
        .btn-next { background-color: #bae1ff; color: #0d47a1; display: none; }
        .btn-start { background-color: #baffc9; color: #2e7d32; font-size: 1.2rem; padding: 10px 25px; }

        .feedback {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <h1>Sentence Scramble - Translation List</h1>

    <!-- Setup Screen -->
    <div class="setup-screen" id="setup-screen">
        <h2>Game Settings</h2>
        
        <div class="config-section">
            <span class="config-label">Players Mode:</span>
            <div class="mode-selector">
                <button class="mode-btn selected" id="mode-single" onclick="setGameMode(1)">1 Player 👤</button>
                <button class="mode-btn" id="mode-multi" onclick="setGameMode(2)">2 Players 👥</button>
            </div>
        </div>

        <div class="config-section">
            <span class="config-label">Timer Mode (40s):</span>
            <div class="mode-selector">
                <button class="mode-btn" id="timer-off" onclick="setTimerMode(false)">Off ❌</button>
                <button class="mode-btn selected" id="timer-on" onclick="setTimerMode(true)">On ⏱️</button>
            </div>
        </div>
        
        <!-- Player 1 Setup -->
        <div class="player-setup-box" id="p1-box">
            <input type="text" id="player1-name" placeholder="Player Name" value="Player 1">
            <div class="avatar-selector" id="p1-avatars">
                <span class="avatar-option selected" data-player="1" data-avatar="🦁">🦁</span>
                <span class="avatar-option" data-player="1" data-avatar="🚀">🚀</span>
                <span class="avatar-option" data-player="1" data-avatar="🦄">🦄</span>
                <span class="avatar-option" data-player="1" data-avatar="🦖">🦖</span>
                <span class="avatar-option" data-player="1" data-avatar="⭐">⭐</span>
                <span class="avatar-option" data-player="1" data-avatar="🐱">🐱</span>
                <span class="avatar-option" data-player="1" data-avatar="🤖">🤖</span>
                <span class="avatar-option" data-player="1" data-avatar="👽">👽</span>
                <span class="avatar-option" data-player="1" data-avatar="⚽">⚽</span>
                <span class="avatar-option" data-player="1" data-avatar="🎨">🎨</span>
            </div>
        </div>

        <!-- Player 2 Setup -->
        <div class="player-setup-box" id="p2-box" style="display: none;">
            <input type="text" id="player2-name" placeholder="Player 2 Name" value="Player 2">
            <div class="avatar-selector" id="p2-avatars">
                <span class="avatar-option" data-player="2" data-avatar="🦁">🦁</span>
                <span class="avatar-option selected" data-player="2" data-avatar="🚀">🚀</span>
                <span class="avatar-option" data-player="2" data-avatar="🦄">🦄</span>
                <span class="avatar-option" data-player="2" data-avatar="🦖">🦖</span>
                <span class="avatar-option" data-player="2" data-avatar="⭐">⭐</span>
                <span class="avatar-option" data-player="2" data-avatar="🐱">🐱</span>
                <span class="avatar-option" data-player="2" data-avatar="🤖">🤖</span>
                <span class="avatar-option" data-player="2" data-avatar="👽">👽</span>
                <span class="avatar-option" data-player="2" data-avatar="⚽">⚽</span>
                <span class="avatar-option" data-player="2" data-avatar="🎨">🎨</span>
            </div>
        </div>

        <button class="btn-start" id="btn-start-game">Start Game! 🚀</button>
    </div>
    
    <div class="stats-bar" id="stats-bar">
        <div>Round: <span id="level-display">1</span>/10</div>
        <div class="timer-display" id="timer-box">⏱️ <span id="timer-count">30</span>s</div>
        <div class="scores-container" id="scores-container-view">
            <div class="score-counter active-player" id="p1-score-box"><span id="p1-icon">🦁</span> <span id="p1-label">Player 1</span>: <span id="p1-score">0</span></div>
            <div class="score-counter" id="p2-score-box" style="display: none;"><span id="p2-icon">🚀</span> <span id="p2-label">Player 2</span>: <span id="p2-score">0</span></div>
        </div>
    </div>

    <div class="game-container" id="game-container">
        <div class="word-bank" id="word-bank"></div>
        <div class="drop-zone" id="drop-zone"></div>
        <div class="feedback" id="feedback"></div>

        <div class="controls">
            <button class="btn-home" id="btn-home">🏠 Home</button>
            <button class="btn-reset" id="btn-reset">↺ Reset</button>
            <button class="btn-help" id="btn-help">🔊 Listen Help</button>
            <button class="btn-skip" id="btn-skip">⏩ Skip</button>
            <button class="btn-check" id="btn-check">✓ Check Answer</button>
            <button class="btn-next" id="btn-next">Next Level ➔</button>
        </div>
    </div>

    <script>
        // Array exacto con las oraciones en inglés extraídas del PDF proporcionado
        const allSentences = [
            // Página 1 (101)
            "I'm bored", "Good bye!", "Good morning!", "What's your name?", "My name is Luna", 
            "What's your favourite colour?", "My favourite colour is red", "This is my mum", 
            "This is my dad", "This is my sister", "This is my brother", "This is my granny", 
            "This is my grandad", "This is my family", "I love my family", "How are you?", 
            "I'm sad", "I'm happy", "I'm tired", "I'm hungry",

            // Página 2 (102)
            "I've got a sharpener", "I've got a book", "I've got a yellow pencil", "I've got a blue ruler", 
            "I've got a green pencil case", "I've got a pink rubber", "I've got a purple school bag", 
            "I've got a red pen", "I've got an orange crayon", "I've got two crayons", "I've got three pencils", 
            "I've got four books", "I've got five rulers", "What's this?", "It's a pen", "It's a school bag", 
            "It's a rubber", "It's a sharpener", "It's a pencil case", "It's an orange pencil case", "It's a blue glue",

            // Página 3 (103)
            "I've got a cat", "I've got a rabbit", "I've got a big dog", "I've got a small fish", 
            "I've got a grey mouse", "I've got a black spider", "I've got a brown snake", 
            "I've got a red parrot", "I've got three cats", "I've got two dogs", 
            "I've got six rabbits", "I've got four snakes", "Have you got a mouse? Yes, I have", 
            "Have you got a parrot?", "Have you got a white rabbit?", 
            "Have you got a yellow spider?", "I've got a big horse", "I've got a small hamster", 
            "I've got a happy monkey", "I've got a green tortoise",

            // Página 4 (104)
            "It's a plane", "It's a doll", "It's a game console", "It's a teddy", "It's a scooter", 
            "It's a yellow ball", "It's a grey robot", "What's your favourite toy?", "It's a car", 
            "My favourite toy is a car", "Is it big?", "Is it blue?", 
            "Is it green?", "Is it a scooter?", "How old are you?", 
            "I'm seven", "I'm eight years old", "I'm nine years old", 
            "Happy birthday!",

            // Página 5 (105)
            "I've got a head", "I've got a nose", "I've got two hands", "I've got two legs", 
            "I've got two eyes", "I've got two feet", "I've got two arms", "I've got ten fingers", 
            "I've got ten toes", "Touch your knees", "Touch your ears", "Touch your mouth", 
            "Touch your head", "Clap your hands", "Stamp your feet", "Turn around",

            // Página 6 (106)
            "I like soup", "I like cheese", "I like fish", "I like yogurt", "I don't like fruit", 
            "I like chicken", "I don't like salad", "I like meat", "I don't like cake", "I like bananas", 
            "I don't like oranges", "Do you like apples?", "Do you like pears?", 
            "Do you like cheese?", "Do you like pasta?", "Do you like yogurt?", 
            "I like fish and chicken.", "I like soup and meat.", "I like salad and fruit.", "I like bananas and oranges."
        ];
        
        for (let i = 0; i < allSentences.length; i++) {
            let text = allSentences[i].trim();
            if (!/[.?!]$/.test(text)) {
                text += ".";
            }
            allSentences[i] = text;
        }

        const pastelColors = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8b9ff', '#ffd1dc'];
        
        let totalPlayers = 1;
        let timerEnabled = true;
        let currentSessionSentences = [];
        let currentRound = 0;
        let activePlayer = 1;
        let scores = { 1: 0, 2: 0 };
        let playerNames = { 1: "Player 1", 2: "Player 2" };
        let playerIcons = { 1: "🦁", 2: "🚀" };
        let wordsData = []; 
        let animationFrameId;
        
        let helpUsedInCurrentRound = false;
        let timeLeft = 40;
        let timerInterval = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(330, now);
                oscillator.frequency.setValueAtTime(392, now + 0.1);
                oscillator.frequency.setValueAtTime(523.25, now + 0.2);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                oscillator.start(now);
                oscillator.stop(now + 0.4);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(180, now);
                oscillator.frequency.setValueAtTime(120, now + 0.15);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'skip') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.setValueAtTime(400, now + 0.1);
                
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                
                oscillator.start(now);
                oscillator.stop(now + 0.2);
            }
        }

        const setupScreen = document.getElementById('setup-screen');
        const gameContainer = document.getElementById('game-container');
        const statsBar = document.getElementById('stats-bar');
        const timerBox = document.getElementById('timer-box');
        const timerCountSpan = document.getElementById('timer-count');
        
        const wordBank = document.getElementById('word-bank');
        const dropZone = document.getElementById('drop-zone');
        const feedback = document.getElementById('feedback');
        const btnCheck = document.getElementById('btn-check');
        const btnReset = document.getElementById('btn-reset');
        const btnSkip = document.getElementById('btn-skip');
        const btnHelp = document.getElementById('btn-help');
        const btnHome = document.getElementById('btn-home');
        const btnNext = document.getElementById('btn-next');
        const btnStartGame = document.getElementById('btn-start-game');
        
        const levelDisplay = document.getElementById('level-display');
        const p1Label = document.getElementById('p1-label');
        const p2Label = document.getElementById('p2-label');
        const p1Icon = document.getElementById('p1-icon');
        const p2Icon = document.getElementById('p2-icon');
        const p1Score = document.getElementById('p1-score');
        const p2Score = document.getElementById('p2-score');
        const p1ScoreBox = document.getElementById('p1-score-box');
        const p2ScoreBox = document.getElementById('p2-score-box');

        function setGameMode(num) {
            totalPlayers = num;
            if (num === 1) {
                document.getElementById('mode-single').classList.add('selected');
                document.getElementById('mode-multi').classList.remove('selected');
                document.getElementById('p2-box').style.display = 'none';
                document.getElementById('player1-name').placeholder = "Player Name";
            } else {
                document.getElementById('mode-multi').classList.add('selected');
                document.getElementById('mode-single').classList.remove('selected');
                document.getElementById('p2-box').style.display = 'flex';
                document.getElementById('player1-name').placeholder = "Player 1 Name";
            }
        }

        function setTimerMode(status) {
            timerEnabled = status;
            if (status) {
                document.getElementById('timer-on').classList.add('selected');
                document.getElementById('timer-off').classList.remove('selected');
            } else {
                document.getElementById('timer-off').classList.add('selected');
                document.getElementById('timer-on').classList.remove('selected');
            }
        }

        document.querySelectorAll('.avatar-option').forEach(option => {
            option.addEventListener('click', (e) => {
                const playerNum = e.target.dataset.player;
                const selectedAvatar = e.target.dataset.avatar;
                
                document.querySelectorAll(`.avatar-option[data-player="${playerNum}"]`).forEach(el => {
                    el.classList.remove('selected');
                });
                
                e.target.classList.add('selected');
                playerIcons[playerNum] = selectedAvatar;
            });
        });

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        btnStartGame.addEventListener('click', () => {
            const p1Input = document.getElementById('player1-name').value.trim();
            const p2Input = document.getElementById('player2-name').value.trim();
            
            if (p1Input) playerNames[1] = p1Input;
            if (p2Input) playerNames[2] = p2Input;

            p1Label.innerText = playerNames[1];
            p1Icon.innerText = playerIcons[1];
            p1ScoreBox.style.display = 'flex';

            if (totalPlayers === 2) {
                p2Label.innerText = playerNames[2];
                p2Icon.innerText = playerIcons[2];
                p2ScoreBox.style.display = 'flex';
            } else {
                p2ScoreBox.style.display = 'none';
            }

            if (timerEnabled) {
                timerBox.style.display = 'block';
            } else {
                timerBox.style.display = 'none';
            }

            setupScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            statsBar.style.display = 'flex';

            startNewGame();
        });

        btnHome.addEventListener('click', () => {
            clearInterval(timerInterval);
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            gameContainer.style.display = 'none';
            statsBar.style.display = 'none';
            setupScreen.style.display = 'flex';
            
            const replayBtn = document.getElementById('btn-replay');
            if (replayBtn) replayBtn.remove();
        });

        function startNewGame() {
            const shuffled = shuffleArray([...allSentences]);
            currentSessionSentences = shuffled.slice(0, 10);
            
            currentRound = 0;
            activePlayer = 1;
            scores = { 1: 0, 2: 0 };
            
            p1Score.innerText = scores[1];
            p2Score.innerText = scores[2];
            
            const replayBtn = document.getElementById('btn-replay');
            if (replayBtn) replayBtn.remove();

            btnReset.style.display = 'inline-block';
            btnSkip.style.display = 'inline-block';
            btnHelp.style.display = 'inline-block';
            updateTurnDisplay();
            initLevel();
        }

        function updateTurnDisplay() {
            if (activePlayer === 1) {
                p1ScoreBox.classList.add('active-player');
                p2ScoreBox.classList.remove('active-player');
            } else {
                p2ScoreBox.classList.add('active-player');
                p1ScoreBox.classList.remove('active-player');
            }
        }

        function startTimer() {
            if (!timerEnabled) return;
            clearInterval(timerInterval);
            timeLeft = 40;
            timerCountSpan.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerCountSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound('error');
                    feedback.innerText = "⏰ Time's up! Moving to next round.";
                    feedback.style.color = "#d32f2f";
                    btnCheck.style.display = 'none';
                    btnSkip.style.display = 'none';
                    btnHelp.style.display = 'none';
                    btnNext.style.display = 'inline-block';
                }
            }, 1000);
        }

        function initLevel() {
            wordBank.innerHTML = '';
            dropZone.innerHTML = '';
            feedback.innerText = '';
            helpUsedInCurrentRound = false;
            btnNext.style.display = 'none';
            btnCheck.style.display = 'inline-block';
            btnSkip.style.display = 'inline-block';
            btnHelp.style.display = 'inline-block';
            levelDisplay.innerText = currentRound + 1;
            wordsData = [];

            const sentence = currentSessionSentences[currentRound];
            const words = sentence.split(' ').sort(() => Math.random() - 0.5);

            const bankRect = wordBank.getBoundingClientRect();

            words.forEach((word, index) => {
                const el = document.createElement('div');
                el.className = 'word-card in-bank';
                el.id = 'word-' + index;
                el.draggable = true;
                el.innerText = word;
                
                el.style.backgroundColor = pastelColors[index % pastelColors.length];
                
                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragend', handleDragEnd);
                el.addEventListener('click', handleWordClick);

                wordBank.appendChild(el);

                const width = el.offsetWidth;
                const height = el.offsetHeight;
                
                const x = Math.random() * Math.max(1, bankRect.width - width);
                const y = Math.random() * Math.max(1, bankRect.height - height);
                
                const speedMulti = 0.8 + Math.random() * 1.0; 
                const vx = (Math.random() > 0.5 ? 1 : -1) * speedMulti;
                const vy = (Math.random() > 0.5 ? 1 : -1) * speedMulti;

                wordsData.push({ id: el.id, el, x, y, vx, vy, width, height });
            });

            if (!animationFrameId) {
                animate();
            }

            startTimer();
        }

        function animate() {
            const bankRect = wordBank.getBoundingClientRect();

            wordsData.forEach(w => {
                if (w.el.parentElement !== wordBank || w.el.dataset.dragging === 'true') {
                    return;
                }

                w.x += w.vx;
                w.y += w.vy;

                if (w.x <= 0) { w.x = 0; w.vx = Math.abs(w.vx); }
                if (w.y <= 0) { w.y = 0; w.vy = Math.abs(w.vy); }
                if (w.x + w.width >= bankRect.width) { w.x = Math.max(0, bankRect.width - w.width); w.vx = -Math.abs(w.vx); }
                if (w.y + w.height >= bankRect.height) { w.y = Math.max(0, bankRect.height - w.height); w.vy = -Math.abs(w.vy); }

                w.el.style.transform = `translate(${w.x}px, ${w.y}px)`;
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        function handleWordClick(e) {
            const el = e.target;
            if (el.parentElement === wordBank) {
                dropZone.appendChild(el);
                el.className = 'word-card in-drop-zone';
                el.style.transform = 'none';
            } else if (el.parentElement === dropZone) {
                wordBank.appendChild(el);
                el.className = 'word-card in-bank';
                const data = wordsData.find(w => w.id === el.id);
                if (data) {
                    const bankRect = wordBank.getBoundingClientRect();
                    data.x = (bankRect.width / 2) - (data.width / 2);
                    data.y = (bankRect.height / 2) - (data.height / 2);
                }
            }
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            e.target.dataset.dragging = 'true';
            setTimeout(() => e.target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.target.dataset.dragging = 'false';
            e.target.classList.remove('dragging');
        }

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/plain');
            const el = document.getElementById(id);
            if (el) {
                const afterElement = getDragAfterElement(dropZone, e.clientX);
                if (afterElement == null) {
                    dropZone.appendChild(el);
                } else {
                    dropZone.insertBefore(el, afterElement);
                }
                el.className = 'word-card in-drop-zone';
                el.style.transform = 'none';
            }
        });

        wordBank.addEventListener('dragover', e => e.preventDefault());
        wordBank.addEventListener('drop', e => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const el = document.getElementById(id);
            if (el && el.parentElement !== wordBank) {
                wordBank.appendChild(el);
                el.className = 'word-card in-bank';
                const data = wordsData.find(w => w.id === id);
                if (data) {
                    const rect = wordBank.getBoundingClientRect();
                    data.x = e.clientX - rect.left - (data.width / 2);
                    data.y = e.clientY - rect.top - (data.height / 2);
                }
            }
        });

        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.word-card:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        btnHelp.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                helpUsedInCurrentRound = true;
                const sentenceToRead = currentSessionSentences[currentRound];
                const utterance = new SpeechSynthesisUtterance(sentenceToRead);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
                feedback.innerText = "🔊 Listening to help! (Points will be halved)";
                feedback.style.color = "#f57f17";
            } else {
                alert("Text-to-speech is not supported in your browser.");
            }
        });

        btnCheck.addEventListener('click', () => {
            const droppedWords = Array.from(dropZone.querySelectorAll('.word-card'));
            const currentAnswer = droppedWords.map(w => w.innerText).join(' ');
            const correctAnswer = currentSessionSentences[currentRound];

            if (currentAnswer === correctAnswer) {
                clearInterval(timerInterval);
                playSound('success');
                const displayName = totalPlayers === 2 ? playerNames[activePlayer] : "Great Job!";
                
                let roundPoints = helpUsedInCurrentRound ? 5 : 10;
                scores[activePlayer] += roundPoints;

                if (activePlayer === 1) p1Score.innerText = scores[1];
                else p2Score.innerText = scores[2];

                let helpTextMsg = helpUsedInCurrentRound ? " (Half points due to help!)" : "";
                feedback.innerText = `🌟 Awesome, ${displayName}! Correct! +${roundPoints}pts${helpTextMsg} 🌟`;
                feedback.style.color = "#2e7d32";
                
                btnCheck.style.display = 'none';
                btnSkip.style.display = 'none';
                btnHelp.style.display = 'none';
                btnNext.style.display = 'inline-block';
            } else {
                playSound('error');
                feedback.innerText = "Oops! That's not quite right. Try again, use Help, or Skip!";
                feedback.style.color = "#d32f2f";
            }
        });

        btnSkip.addEventListener('click', () => {
            clearInterval(timerInterval);
            playSound('skip');
            feedback.innerText = `Skipped! Correct sentence was: "${currentSessionSentences[currentRound]}"`;
            feedback.style.color = "#e65100";
            
            btnCheck.style.display = 'none';
            btnSkip.style.display = 'none';
            btnHelp.style.display = 'none';
            btnNext.style.display = 'inline-block';
        });

        btnReset.addEventListener('click', () => {
            wordsData.forEach(w => {
                if (w.el.parentElement !== wordBank) {
                    wordBank.appendChild(w.el);
                    w.el.className = 'word-card in-bank';
                    const bankRect = wordBank.getBoundingClientRect();
                    w.x = (bankRect.width / 2) - (w.width / 2);
                    w.y = (bankRect.height / 2) - (w.height / 2);
                }
            });
            feedback.innerText = "";
        });

        btnNext.addEventListener('click', () => {
            currentRound++;
            if (totalPlayers === 2) {
                activePlayer = activePlayer === 1 ? 2 : 1;
                updateTurnDisplay();
            }

            if (currentRound < currentSessionSentences.length) {
                initLevel();
            } else {
                wordBank.innerHTML = '';
                dropZone.innerHTML = '';
                timerBox.style.display = 'none';
                
                let winText = "";
                if (totalPlayers === 2) {
                    if (scores[1] > scores[2]) {
                        winText = `🏆🎉 ${playerIcons[1]} ${playerNames[1]} Wins with ${scores[1]} pts! 🎉🏆`;
                    } else if (scores[2] > scores[1]) {
                        winText = `🏆🎉 ${playerIcons[2]} ${playerNames[2]} Wins with ${scores[2]} pts! 🎉🏆`;
                    } else {
                        winText = `🤝 It's a Tie! Both scored ${scores[1]} pts! 🤝`;
                    }
                } else {
                    winText = `🎉 Congratulations! Final Score: ${scores[1]} pts! 🎉`;
                }

                feedback.innerText = winText;
                feedback.style.color = "#ff4081";
                btnNext.style.display = 'none';
                btnCheck.style.display = 'none';
                btnReset.style.display = 'none';
                btnSkip.style.display = 'none';
                btnHelp.style.display = 'none';
                
                const replayBtn = document.createElement('button');
                replayBtn.className = 'btn-check';
                replayBtn.id = 'btn-replay';
                replayBtn.innerText = 'Play Again 🔄';
                replayBtn.onclick = startNewGame;
                
                document.querySelector('.controls').appendChild(replayBtn);
            }
        });

        window.addEventListener('resize', () => {
            const bankRect = wordBank.getBoundingClientRect();
            wordsData.forEach(w => {
                if (w.x + w.width > bankRect.width) w.x = Math.max(0, bankRect.width - w.width);
                if (w.y + w.height > bankRect.height) w.y = Math.max(0, bankRect.height - w.height);
            });
        });
    </script>
</body>
</html>
